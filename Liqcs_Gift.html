<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift</title>

<style>
body {
    margin: 0;
    background: #ffffff;
    color: #000000;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.container {
    max-width: 700px;
    padding: 20px;
}

h1 {
    margin-bottom: 20px;
}

p {
    font-size: 1.2em;
    margin-bottom: 30px;
}

button {
    padding: 12px 28px;
    font-size: 18px;
    cursor: pointer;
    border: 1px solid #000;
    border-radius: 8px;
    margin: 10px;
    background: #fff;
    color: #000;
}

#yesBtn {
    background: #fff;
    color: #000;
}

#noBtn {
    background: #fff;
    color: #000;
}

#gift {
    display: none;
    margin-top: 30px;
    font-size: 1.3em;
}
</style>
</head>
<body>

<div class="container">
    <h1>Hello Lilqcs.</h1>

    <p>once again i ask you.</p>

    <h2>Are you Mafia?</h2>

    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>

    <div id="gift">
        Correct answer detected.<br><br>
        <a href="https://imgur.com/NwAU7yJ" target="_blank" style="color:#000;">
            Click here to claim your gift
        </a>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

function moveButton() {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    noBtn.style.position = "absolute";
    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
}

noBtn.addEventListener("mouseenter", moveButton);

document.getElementById("yesBtn").addEventListener("click", () => {
    document.getElementById("gift").style.display = "block";
});
</script>

</body>
</html>
